<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>취업 준비 역량 체크리스트</title>
<meta name="description" content="회사별 채용공고 기반 역량 체크리스트">
<meta property="og:title" content="취업 준비 역량 체크리스트">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f0f0f5;
    --border: #e0e0e8;
    --accent: #4f6ef7;
    --accent2: #7c5cfc;
    --text: #111118;
    --text-muted: #606080;
    --text-dim: #a0a0b8;
    --red: #dc2626;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  .page-wrap { max-width: 860px; margin: 0 auto; }

  /* Header */
  .header { margin-bottom: 44px; position: relative; }
  .header-tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.15em;
    color: var(--accent);
    background: rgba(79,110,247,0.08);
    border: 1px solid rgba(79,110,247,0.2);
    padding: 4px 12px; border-radius: 100px;
    margin-bottom: 14px; text-transform: uppercase;
  }
  .header h1 {
    font-size: clamp(24px, 5vw, 38px); font-weight: 900;
    letter-spacing: -0.03em; margin-bottom: 8px;
    background: linear-gradient(135deg, #111118 0%, #4f6ef7 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .header-line {
    position: absolute; top: 0; right: 0;
    width: 90px; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
  }

  /* Global progress */
  .progress-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px 22px; margin-bottom: 32px;
    display: flex; align-items: center; gap: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .progress-count {
    font-family: 'DM Mono', monospace; font-size: 26px;
    font-weight: 500; color: var(--accent); line-height: 1; flex-shrink: 0;
  }
  .progress-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .progress-bar-wrap { flex: 1; }
  .progress-bar-bg { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px; width: 0%; transition: width 0.4s ease;
  }
  .progress-pct { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); margin-top: 5px; text-align: right; }

  /* Company section */
  .company-section {
    margin-bottom: 24px; border-radius: 20px; overflow: hidden;
    border: 2px solid var(--border); background: var(--surface);
    box-shadow: 0 2px 12px rgba(0,0,0,0.04); transition: border-color 0.2s;
  }
  .company-section:hover { border-color: rgba(79,110,247,0.2); }

  .company-header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .company-emoji {
    font-size: 20px; width: 42px; height: 42px; border-radius: 12px;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; transition: transform 0.15s;
  }
  .company-emoji:hover { transform: scale(1.12); }
  .company-name-wrap { flex: 1; min-width: 0; }
  .company-name {
    font-size: 16px; font-weight: 800; letter-spacing: -0.02em;
    outline: none; border: none; background: transparent;
    color: var(--text); font-family: 'Noto Sans KR', sans-serif; width: 100%;
    border-bottom: 2px solid transparent; transition: border-color 0.15s;
  }
  .company-name:focus { border-bottom-color: var(--accent); }
  .company-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .company-progress-mini {
    font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent);
    background: rgba(79,110,247,0.08); border: 1px solid rgba(79,110,247,0.15);
    padding: 3px 10px; border-radius: 100px; flex-shrink: 0;
  }
  .company-chevron { color: var(--text-dim); transition: transform 0.3s; flex-shrink: 0; }
  .company-section.collapsed .company-chevron { transform: rotate(-90deg); }
  .company-delete-btn {
    background: none; border: none; color: var(--text-dim); font-size: 18px;
    cursor: pointer; padding: 4px 6px; border-radius: 6px;
    transition: color 0.15s, background 0.15s; flex-shrink: 0; opacity: 0;
  }
  .company-header:hover .company-delete-btn { opacity: 1; }
  .company-delete-btn:hover { color: var(--red); background: rgba(220,38,38,0.08); }

  .company-body {
    overflow: hidden; max-height: 9999px;
    transition: max-height 0.4s ease, opacity 0.3s ease; opacity: 1;
  }
  .company-section.collapsed .company-body { max-height: 0; opacity: 0; }

  /* Category */
  .category { border-bottom: 1px solid var(--border); }
  .category:last-of-type { border-bottom: none; }

  .category-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px; cursor: pointer; user-select: none;
    background: var(--surface2); transition: background 0.15s;
  }
  .category-header:hover { background: #e8e8f2; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cat-title { flex: 1; font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .cat-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .cat-chevron { color: var(--text-dim); transition: transform 0.25s; }
  .category.collapsed .cat-chevron { transform: rotate(-90deg); }

  .items-wrap { overflow: hidden; max-height: 9999px; transition: max-height 0.3s ease, opacity 0.2s ease; opacity: 1; }
  .category.collapsed .items-wrap { max-height: 0; opacity: 0; }

  /* Items */
  .item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 20px; cursor: pointer; transition: background 0.12s;
    border-top: 1px solid var(--border);
  }
  .item:hover { background: var(--surface2); }
  .checkbox {
    width: 20px; height: 20px; border: 1.5px solid var(--border);
    border-radius: 6px; flex-shrink: 0; margin-top: 1px;
    position: relative; transition: all 0.15s; background: transparent;
  }
  .checkbox::after {
    content: ''; position: absolute; top: 3px; left: 6px;
    width: 5px; height: 9px; border: 2px solid #fff;
    border-top: none; border-left: none;
    transform: rotate(45deg); opacity: 0; transition: opacity 0.15s;
  }
  .item.checked .checkbox { background: var(--accent); border-color: var(--accent); }
  .item.checked .checkbox::after { opacity: 1; }
  .item.checked .item-text { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--text-dim); }
  .item-content { flex: 1; min-width: 0; }
  .item-text { font-size: 14px; line-height: 1.5; color: var(--text); transition: color 0.15s; }
  .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; font-weight: 300; }

  /* Tags */
  .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
  .tag {
    display: inline-flex; align-items: center; gap: 3px;
    font-family: 'DM Mono', monospace; font-size: 10px;
    padding: 2px 8px; border-radius: 100px;
    background: rgba(79,110,247,0.08); color: #5060c0;
    border: 1px solid rgba(79,110,247,0.18);
  }
  .tag .tag-del {
    cursor: pointer; opacity: 0; font-size: 11px; line-height: 1;
    color: var(--text-dim); background: none; border: none;
    padding: 0 0 0 2px; transition: opacity 0.15s, color 0.15s;
  }
  .tag:hover .tag-del { opacity: 1; }
  .tag-del:hover { color: var(--red) !important; }

  .tag-add-btn {
    font-size: 10px; color: var(--text-dim); background: none;
    border: 1px dashed var(--border); border-radius: 100px;
    padding: 2px 8px; cursor: pointer; font-family: 'DM Mono', monospace;
    transition: border-color 0.15s, color 0.15s;
  }
  .tag-add-btn:hover { border-color: var(--accent); color: var(--accent); }

  .tag-input-wrap { display: none; align-items: center; gap: 4px; }
  .tag-input-wrap.active { display: flex; }
  .tag-input {
    font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 8px;
    border: 1px solid var(--accent); border-radius: 100px; outline: none;
    width: 100px; color: var(--text); background: var(--surface);
  }
  .tag-confirm-btn {
    font-size: 10px; background: var(--accent); color: #fff; border: none;
    border-radius: 100px; padding: 2px 8px; cursor: pointer; font-family: 'DM Mono', monospace;
  }

  /* Item delete */
  .item-delete {
    opacity: 0; background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 2px 4px; border-radius: 6px;
    transition: opacity 0.15s, color 0.15s; flex-shrink: 0;
  }
  .item:hover .item-delete { opacity: 1; }
  .item-delete:hover { color: var(--red); }

  /* Add item row */
  .add-item-row {
    padding: 10px 20px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .add-item-trigger {
    display: flex; align-items: center; gap: 7px; color: var(--text-dim);
    font-size: 13px; cursor: pointer; background: none; border: none;
    font-family: 'Noto Sans KR', sans-serif; padding: 4px 0; transition: color 0.15s;
  }
  .add-item-trigger:hover { color: var(--accent); }
  .add-item-form { display: none; flex-direction: column; gap: 8px; padding-top: 8px; }
  .add-item-form.open { display: flex; }
  .add-item-form input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); outline: none; transition: border-color 0.15s;
  }
  .add-item-form input:focus { border-color: var(--accent); }
  .add-form-btns { display: flex; gap: 6px; }
  .btn-confirm {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 7px 16px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-confirm:hover { opacity: 0.85; }
  .btn-cancel {
    background: none; color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 16px; font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
  }

  /* Add category row */
  .add-cat-row { padding: 12px 20px; background: var(--bg); }
  .add-cat-trigger {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--text-dim); cursor: pointer; background: none; border: none;
    font-family: 'Noto Sans KR', sans-serif; transition: color 0.15s;
  }
  .add-cat-trigger:hover { color: var(--accent); }
  .add-cat-form { display: none; flex-direction: column; gap: 8px; padding-top: 8px; }
  .add-cat-form.open { display: flex; }
  .add-cat-form input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); outline: none; transition: border-color 0.15s;
  }
  .add-cat-form input:focus { border-color: var(--accent); }

  /* Add company */
  .add-company-section {
    margin-bottom: 24px; background: var(--surface);
    border: 2px dashed var(--border); border-radius: 20px; padding: 20px;
    transition: border-color 0.2s;
  }
  .add-company-section:focus-within { border-color: rgba(79,110,247,0.4); border-style: solid; }
  .add-company-trigger {
    display: flex; align-items: center; gap: 10px; color: var(--text-muted);
    font-size: 14px; cursor: pointer; background: none; border: none;
    font-family: 'Noto Sans KR', sans-serif; transition: color 0.15s;
  }
  .add-company-trigger:hover { color: var(--accent); }
  .add-company-form { display: none; flex-direction: column; gap: 10px; }
  .add-company-form.open { display: flex; }
  .add-company-form input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); outline: none; transition: border-color 0.15s;
  }
  .add-company-form input:focus { border-color: var(--accent); }
  .btn-add-company {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    border: none; border-radius: 10px; padding: 10px 22px; font-size: 13px;
    font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-add-company:hover { opacity: 0.85; }

  /* Footer */
  .footer { margin-top: 44px; text-align: center; color: var(--text-dim); font-size: 12px; font-family: 'DM Mono', monospace; }
  .footer-btns { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .footer-btn {
    padding: 8px 18px; border-radius: 8px; font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .footer-btn.outline { background: none; border: 1px solid var(--border); color: var(--text-muted); }
  .footer-btn.outline:hover { border-color: var(--accent); color: var(--accent); }
  .footer-btn.filled { background: rgba(79,110,247,0.08); border: 1px solid rgba(79,110,247,0.2); color: #5060d0; }
  .footer-btn.filled:hover { background: rgba(79,110,247,0.15); }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #111118; color: #fff; font-size: 13px;
    padding: 10px 20px; border-radius: 100px; opacity: 0;
    transition: opacity 0.25s, transform 0.25s; pointer-events: none;
    z-index: 999; font-family: 'Noto Sans KR', sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15); white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Emoji picker */
  .emoji-picker {
    position: absolute; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px; flex-wrap: wrap; gap: 4px;
    width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); z-index: 100; display: none;
  }
  .emoji-picker.open { display: flex; }
  .emoji-picker span { font-size: 20px; cursor: pointer; padding: 4px; border-radius: 6px; transition: background 0.1s; }
  .emoji-picker span:hover { background: var(--surface2); }

  /* Shared banner */
  .shared-banner {
    background: rgba(79,110,247,0.06); border: 1px solid rgba(79,110,247,0.15);
    border-radius: 12px; padding: 10px 18px; margin-bottom: 20px;
    font-size: 13px; color: var(--accent); display: none; align-items: center; gap: 8px;
  }
  .shared-banner.visible { display: flex; }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="shared-banner" id="shared-banner">
    <span>🔗</span><span>공유된 링크로 접속했어요. 체크 상태가 반영되어 있어요.</span>
  </div>

  <header class="header">
    <div class="header-line"></div>
    <div class="header-tag">Job Prep Checklist</div>
    <h1>취업 준비 역량 체크리스트</h1>
    <p>회사별로 필요한 역량을 정리하고 체크해보세요.</p>
  </header>

  <div class="progress-wrap">
    <div>
      <div class="progress-count" id="g-checked">0</div>
      <div class="progress-label">/ <span id="g-total">0</span> 전체 완료</div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="g-bar"></div></div>
      <div class="progress-pct" id="g-pct">0%</div>
    </div>
  </div>

  <div id="companies-wrap"></div>

  <!-- Add company -->
  <div class="add-company-section" id="add-company-section">
    <button class="add-company-trigger" id="add-company-trigger" onclick="openAddCompany()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      새 회사 추가하기
    </button>
    <div class="add-company-form" id="add-company-form">
      <input id="company-name-input" type="text" placeholder="회사 이름 (예: 카카오)" maxlength="30" />
      <input id="company-role-input" type="text" placeholder="직군 (예: Product Designer)" maxlength="40" />
      <div class="add-form-btns">
        <button class="btn-add-company" onclick="addCompany()">추가</button>
        <button class="btn-cancel" onclick="closeAddCompany()">취소</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>취업 준비 역량 체크리스트</div>
    <div class="footer-btns">
      <button class="footer-btn outline" onclick="resetAll()">전체 초기화</button>
      <button class="footer-btn filled" onclick="shareURL()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        현재 상태 공유
      </button>
    </div>
  </div>
</div>

<div class="emoji-picker" id="emoji-picker">
  <span>🏢</span><span>💼</span><span>🚀</span><span>💡</span><span>🌟</span>
  <span>🎯</span><span>🔥</span><span>✨</span><span>🏆</span><span>💎</span>
  <span>🌈</span><span>🦁</span><span>🐯</span><span>🦊</span><span>🍎</span>
  <span>🌸</span><span>⚡</span><span>🎨</span><span>📱</span><span>💻</span>
  <span>🛠</span><span>📊</span><span>🎭</span><span>🌿</span><span>🐳</span>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'job_checklist_v2';
let state = { companies: [] };
let emojiTargetId = null;
let idCounter = Date.now();
function uid() { return 'x' + (++idCounter); }

// Default Toss data
function getDefaultData() {
  return { companies: [{
    id: uid(), name: '토스', role: 'Product Designer', emoji: '🚀',
    categories: [
      { id: uid(), name: '🎨 UI / 시각 디자인', color: '#4f6ef7', items: [
        { id: uid(), text: 'Figma 핵심 기능 숙련', sub: 'Auto Layout, Component/Variant, Prototype, Dev Mode', tags: ['Figma', 'Tool'], checked: false },
        { id: uid(), text: '디자인 시스템 이해 및 활용', sub: '토큰(Color, Spacing, Typography) 구조 이해, 컴포넌트 기반 화면 구성', tags: ['Design System'], checked: false },
        { id: uid(), text: '모바일 UI 가이드라인 이해', sub: 'HIG, Material Design 원칙 숙지 및 플랫폼별 패턴 차이 이해', tags: ['iOS HIG', 'Material'], checked: false },
        { id: uid(), text: '타이포그래피 설계 능력', sub: '위계(Hierarchy), 가독성, 자간·행간 세팅 등 텍스트 조형', tags: ['Typography'], checked: false },
        { id: uid(), text: '색상 & 대비 활용 능력', sub: 'WCAG 접근성 기준 이해, 브랜드 팔레트 내 의미 있는 색상 사용', tags: ['Color', 'Accessibility'], checked: false },
        { id: uid(), text: '인터랙션 / 마이크로 애니메이션 설계', sub: 'Figma Prototype 또는 ProtoPie로 전환·피드백 모션 표현', tags: ['ProtoPie', 'Interaction'], checked: false },
        { id: uid(), text: '개발 핸드오프 경험', sub: 'Figma Dev Mode로 개발자에게 스펙 전달, CSS/dp 단위 이해', tags: ['Handoff'], checked: false },
      ]},
      { id: uid(), name: '🔍 문제 정의 & 리서치', color: '#7c5cfc', items: [
        { id: uid(), text: '사용자 인터뷰 설계 및 진행', sub: '인터뷰 가이드 작성, 편향 없는 질문 구성, 인사이트 도출', tags: ['User Interview'], checked: false },
        { id: uid(), text: '사용성 테스트(UT) 수행 경험', sub: '태스크 기반 테스트 기획 및 관찰·분석 경험', tags: ['Usability Test'], checked: false },
        { id: uid(), text: '정량 데이터 분석 능력', sub: '퍼널 분석, Retention, 클릭률 등 데이터 해석 및 Amplitude 활용', tags: ['Amplitude', 'Data'], checked: false },
        { id: uid(), text: '문제 정의 → 가설 수립 → 검증 루프', sub: '"어떤 사용자가, 어떤 상황에서, 왜 이 문제를 겪는가" 명확히 정의', tags: ['Problem Framing'], checked: false },
        { id: uid(), text: '경쟁사 / 레퍼런스 벤치마킹', sub: '유사 서비스 분석해 차별점과 개선 포인트 도출 습관', tags: ['Benchmarking'], checked: false },
      ]},
      { id: uid(), name: '🚀 제품 설계 & 비즈니스', color: '#16a370', items: [
        { id: uid(), text: 'As-Is → To-Be 개선 프로젝트 경험', sub: '기존 화면 문제 발견하고 개선안 설계 후 실제 출시까지 경험', tags: ['출시 경험'], checked: false },
        { id: uid(), text: 'UX Writing / 마이크로카피 설계', sub: '버튼 레이블, 에러 메시지, 온보딩 텍스트 등 UI 내 텍스트 설계', tags: ['UX Writing'], checked: false },
        { id: uid(), text: 'A/B 테스트 설계 및 결과 해석', sub: '실험 단위 설정, 통계적 유의미성 이해, 결과를 다음 이터레이션에 연결', tags: ['A/B Test'], checked: false },
        { id: uid(), text: '비즈니스 목표와 UX를 함께 고민한 경험', sub: 'KPI와 사용자 경험 사이 균형 잡힌 의사결정 경험', tags: ['KPI', 'Product Thinking'], checked: false },
        { id: uid(), text: '포트폴리오에 결과 지표가 포함된 케이스 스터디', sub: '전환율 X% 상승, DAU Y만 증가 등 결과를 수치로 표현한 프로젝트', tags: ['성과 측정'], checked: false },
      ]},
      { id: uid(), name: '🤝 커뮤니케이션 & 협업', color: '#d97706', items: [
        { id: uid(), text: '디자인 의도를 논리적으로 설명하는 능력', sub: '사용자 데이터·원칙·비즈니스 목표와 연결해 설득한 경험', tags: ['Storytelling'], checked: false },
        { id: uid(), text: '개발자와의 원활한 협업 경험', sub: '기술 제약 이해하고 스펙 협의, 구현 후 QA까지 진행 경험', tags: ['Dev Collaboration'], checked: false },
        { id: uid(), text: 'PM / 기획자와의 요구사항 정의 경험', sub: '불명확한 요구사항을 명확한 디자인 문제로 번역하고 범위 조율', tags: ['PM Collaboration'], checked: false },
        { id: uid(), text: '주도적 의사결정 경험 (오너십)', sub: '승인 없이 스스로 결정하고 실행, 또는 소규모 팀에서 1인 디자이너로 일한 경험', tags: ['Ownership'], checked: false },
        { id: uid(), text: '피드백을 수용하고 빠르게 이터레이션하는 자세', sub: '팀 리뷰나 사용자 테스트 피드백을 방어적이지 않게 받아들이고 반영', tags: ['Growth Mindset'], checked: false },
      ]},
    ]
  }]};
}

// Render
function render() {
  const wrap = document.getElementById('companies-wrap');
  wrap.innerHTML = '';
  state.companies.forEach(c => wrap.appendChild(renderCompany(c)));
  updateGlobalProgress();
}

function renderCompany(company) {
  const section = document.createElement('div');
  section.className = 'company-section';
  section.dataset.id = company.id;

  const header = document.createElement('div');
  header.className = 'company-header';
  header.innerHTML = `
    <div class="company-emoji" id="emoji-btn-${company.id}">${escH(company.emoji||'🏢')}</div>
    <div class="company-name-wrap">
      <input class="company-name" value="${escH(company.name)}" placeholder="회사 이름"
        oninput="updateCompanyField('${company.id}','name',this.value)"
        onclick="event.stopPropagation()" />
      <div class="company-meta">${escH(company.role||'')}</div>
    </div>
    <div class="company-progress-mini" id="cprog-${company.id}">0/0</div>
    <div class="company-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div>
    <button class="company-delete-btn" onclick="deleteCompany('${company.id}',event)">×</button>
  `;

  // emoji click
  header.querySelector('.company-emoji').addEventListener('click', (e) => {
    e.stopPropagation();
    emojiTargetId = company.id;
    const picker = document.getElementById('emoji-picker');
    const rect = e.currentTarget.getBoundingClientRect();
    picker.style.top = (rect.bottom + window.scrollY + 6) + 'px';
    picker.style.left = rect.left + 'px';
    picker.style.position = 'absolute';
    picker.classList.add('open');
  });

  // collapse toggle
  header.addEventListener('click', (e) => {
    if (e.target.closest('.company-emoji,.company-name,.company-delete-btn')) return;
    section.classList.toggle('collapsed');
  });

  const body = document.createElement('div');
  body.className = 'company-body';

  company.categories.forEach(cat => body.appendChild(renderCategory(company.id, cat)));

  // Add category row
  const addCatRow = document.createElement('div');
  addCatRow.className = 'add-cat-row';
  addCatRow.innerHTML = `
    <button class="add-cat-trigger" onclick="openAddCat('${company.id}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      카테고리 추가
    </button>
    <div class="add-cat-form" id="add-cat-form-${company.id}">
      <input id="cat-name-input-${company.id}" type="text" placeholder="카테고리 이름 (예: 🎨 UI 디자인)" maxlength="30"
        onkeydown="if(event.key==='Enter')addCategory('${company.id}')" />
      <div class="add-form-btns">
        <button class="btn-confirm" onclick="addCategory('${company.id}')">추가</button>
        <button class="btn-cancel" onclick="closeAddCat('${company.id}')">취소</button>
      </div>
    </div>
  `;
  body.appendChild(addCatRow);

  section.appendChild(header);
  section.appendChild(body);
  updateCompanyProgress(company);
  return section;
}

function renderCategory(companyId, cat) {
  const div = document.createElement('div');
  div.className = 'category';
  div.dataset.id = cat.id;
  div.innerHTML = `
    <div class="category-header" onclick="this.closest('.category').classList.toggle('collapsed')">
      <div class="cat-dot" style="background:${cat.color||'#4f6ef7'}"></div>
      <div class="cat-title">${escH(cat.name)}</div>
      <div class="cat-count" id="catcount-${cat.id}">${cat.items.length}개</div>
      <div class="cat-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div>
    </div>
    <div class="items-wrap" id="items-${cat.id}"></div>
    <div class="add-item-row">
      <button class="add-item-trigger" onclick="openAddItem('${cat.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        항목 추가
      </button>
      <div class="add-item-form" id="add-item-form-${cat.id}">
        <input id="item-text-${cat.id}" type="text" placeholder="역량 또는 준비 항목" maxlength="60"
          onkeydown="if(event.key==='Enter')addItem('${companyId}','${cat.id}')" />
        <input id="item-sub-${cat.id}" type="text" placeholder="부연 설명 (선택)" maxlength="100"
          onkeydown="if(event.key==='Enter')addItem('${companyId}','${cat.id}')" />
        <div class="add-form-btns">
          <button class="btn-confirm" onclick="addItem('${companyId}','${cat.id}')">추가</button>
          <button class="btn-cancel" onclick="closeAddItem('${cat.id}')">취소</button>
        </div>
      </div>
    </div>
  `;
  const itemsWrap = div.querySelector(`#items-${cat.id}`);
  cat.items.forEach(item => itemsWrap.appendChild(renderItem(companyId, cat.id, item)));
  return div;
}

function renderItem(companyId, catId, item) {
  const div = document.createElement('div');
  div.className = 'item' + (item.checked ? ' checked' : '');
  div.dataset.id = item.id;
  div.onclick = (e) => {
    if (e.target.closest('.item-delete,.tag,.tag-add-btn,.tag-input-wrap')) return;
    toggleItem(companyId, catId, item.id, div);
  };
  const tags = (item.tags||[]).map(t =>
    `<span class="tag">${escH(t)}<button class="tag-del" onclick="deleteTag('${companyId}','${catId}','${item.id}','${escH(t)}',event)">×</button></span>`
  ).join('');
  div.innerHTML = `
    <div class="checkbox"></div>
    <div class="item-content">
      <div class="item-text">${escH(item.text)}</div>
      ${item.sub ? `<div class="item-sub">${escH(item.sub)}</div>` : ''}
      <div class="item-tags">
        ${tags}
        <button class="tag-add-btn" onclick="openTagInput('${item.id}',event)">+ 태그</button>
        <span class="tag-input-wrap" id="tiw-${item.id}">
          <input class="tag-input" id="ti-${item.id}" type="text" placeholder="태그명" maxlength="20"
            onkeydown="handleTagKey(event,'${companyId}','${catId}','${item.id}')" onclick="event.stopPropagation()" />
          <button class="tag-confirm-btn" onclick="confirmTag('${companyId}','${catId}','${item.id}',event)">확인</button>
        </span>
      </div>
    </div>
    <button class="item-delete" onclick="deleteItem('${companyId}','${catId}','${item.id}',event)">×</button>
  `;
  return div;
}

// Toggle
function toggleItem(companyId, catId, itemId, el) {
  const c = findItem(companyId, catId, itemId);
  if (!c) return;
  c.item.checked = !c.item.checked;
  el.classList.toggle('checked', c.item.checked);
  updateGlobalProgress();
  updateCompanyProgress(c.company);
  save();
}

// Tags
function openTagInput(itemId, e) {
  e.stopPropagation();
  document.getElementById('tiw-'+itemId).classList.add('active');
  document.getElementById('ti-'+itemId).focus();
}
function handleTagKey(e, cId, catId, itemId) {
  if (e.key === 'Enter') { e.stopPropagation(); confirmTag(cId, catId, itemId, e); }
  if (e.key === 'Escape') { e.stopPropagation(); document.getElementById('tiw-'+itemId).classList.remove('active'); }
}
function confirmTag(companyId, catId, itemId, e) {
  e.stopPropagation();
  const input = document.getElementById('ti-'+itemId);
  const val = input.value.trim();
  if (!val) return;
  const c = findItem(companyId, catId, itemId);
  if (!c) return;
  if (!c.item.tags) c.item.tags = [];
  if (!c.item.tags.includes(val)) { c.item.tags.push(val); reRenderItem(companyId, catId, c.item); save(); }
  input.value = '';
}
function deleteTag(companyId, catId, itemId, tag, e) {
  e.stopPropagation();
  const c = findItem(companyId, catId, itemId);
  if (!c) return;
  c.item.tags = (c.item.tags||[]).filter(t => t !== tag);
  reRenderItem(companyId, catId, c.item);
  save();
}
function reRenderItem(companyId, catId, item) {
  const old = document.querySelector(`.item[data-id="${item.id}"]`);
  if (old) old.replaceWith(renderItem(companyId, catId, item));
}

// Add/delete items
function openAddItem(catId) { document.getElementById('add-item-form-'+catId).classList.add('open'); document.getElementById('item-text-'+catId).focus(); }
function closeAddItem(catId) {
  document.getElementById('add-item-form-'+catId).classList.remove('open');
  document.getElementById('item-text-'+catId).value = '';
  document.getElementById('item-sub-'+catId).value = '';
}
function addItem(companyId, catId) {
  const textEl = document.getElementById('item-text-'+catId);
  const text = textEl.value.trim();
  if (!text) { textEl.focus(); return; }
  const found = state.companies.find(c=>c.id===companyId);
  const cat = found?.categories.find(c=>c.id===catId);
  if (!cat) return;
  const newItem = { id: uid(), text, sub: document.getElementById('item-sub-'+catId).value.trim(), tags: [], checked: false };
  cat.items.push(newItem);
  document.getElementById('items-'+catId).appendChild(renderItem(companyId, catId, newItem));
  updateCatCount(cat);
  updateGlobalProgress();
  updateCompanyProgress(found);
  closeAddItem(catId);
  save();
}
function deleteItem(companyId, catId, itemId, e) {
  e.stopPropagation();
  const found = state.companies.find(c=>c.id===companyId);
  const cat = found?.categories.find(c=>c.id===catId);
  if (!cat) return;
  cat.items = cat.items.filter(i=>i.id!==itemId);
  const el = document.querySelector(`.item[data-id="${itemId}"]`);
  if (el) { el.style.cssText='opacity:0;transform:translateX(8px);transition:all 0.2s'; setTimeout(()=>{el.remove();updateCatCount(cat);updateGlobalProgress();updateCompanyProgress(found);},200); }
  save();
}

// Add/delete categories
function openAddCat(cId) { document.getElementById('add-cat-form-'+cId).classList.add('open'); document.getElementById('cat-name-input-'+cId).focus(); }
function closeAddCat(cId) { document.getElementById('add-cat-form-'+cId).classList.remove('open'); document.getElementById('cat-name-input-'+cId).value=''; }
function addCategory(companyId) {
  const input = document.getElementById('cat-name-input-'+companyId);
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const company = state.companies.find(c=>c.id===companyId);
  if (!company) return;
  const palette = ['#4f6ef7','#7c5cfc','#16a370','#d97706','#dc2626','#0891b2'];
  const newCat = { id: uid(), name, color: palette[company.categories.length % palette.length], items: [] };
  company.categories.push(newCat);
  const body = document.querySelector(`.company-section[data-id="${companyId}"] .company-body`);
  body.insertBefore(renderCategory(companyId, newCat), body.querySelector('.add-cat-row'));
  closeAddCat(companyId);
  save();
  showToast('카테고리가 추가됐어요!');
}

// Add/delete companies
function openAddCompany() {
  document.getElementById('add-company-form').classList.add('open');
  document.getElementById('add-company-trigger').style.display = 'none';
  document.getElementById('company-name-input').focus();
}
function closeAddCompany() {
  document.getElementById('add-company-form').classList.remove('open');
  document.getElementById('add-company-trigger').style.display = 'flex';
  document.getElementById('company-name-input').value = '';
  document.getElementById('company-role-input').value = '';
}
function addCompany() {
  const name = document.getElementById('company-name-input').value.trim();
  if (!name) { document.getElementById('company-name-input').focus(); return; }
  const newCo = { id: uid(), name, role: document.getElementById('company-role-input').value.trim(), emoji: '🏢', categories: [] };
  state.companies.push(newCo);
  document.getElementById('companies-wrap').appendChild(renderCompany(newCo));
  closeAddCompany();
  save();
  showToast(`${name} 섹션이 추가됐어요!`);
}
function deleteCompany(companyId, e) {
  e.stopPropagation();
  if (!confirm('이 회사 섹션을 삭제할까요?')) return;
  state.companies = state.companies.filter(c=>c.id!==companyId);
  document.querySelector(`.company-section[data-id="${companyId}"]`)?.remove();
  updateGlobalProgress();
  save();
}
function updateCompanyField(companyId, field, val) {
  const co = state.companies.find(c=>c.id===companyId);
  if (co) { co[field] = val; save(); }
}

// Emoji picker
document.getElementById('emoji-picker').querySelectorAll('span').forEach(span => {
  span.onclick = (e) => {
    e.stopPropagation();
    if (!emojiTargetId) return;
    const co = state.companies.find(c=>c.id===emojiTargetId);
    if (co) { co.emoji = span.textContent; document.getElementById('emoji-btn-'+emojiTargetId).textContent = span.textContent; save(); }
    document.getElementById('emoji-picker').classList.remove('open');
    emojiTargetId = null;
  };
});
document.addEventListener('click', () => document.getElementById('emoji-picker').classList.remove('open'));

// Progress
function updateGlobalProgress() {
  let total=0, done=0;
  state.companies.forEach(c=>c.categories.forEach(cat=>cat.items.forEach(i=>{total++;if(i.checked)done++;})));
  document.getElementById('g-checked').textContent = done;
  document.getElementById('g-total').textContent = total;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('g-bar').style.width = pct+'%';
  document.getElementById('g-pct').textContent = pct+'%';
}
function updateCompanyProgress(company) {
  let total=0, done=0;
  company.categories.forEach(cat=>cat.items.forEach(i=>{total++;if(i.checked)done++;}));
  const el = document.getElementById('cprog-'+company.id);
  if (el) el.textContent = `${done}/${total}`;
}
function updateCatCount(cat) {
  const el = document.getElementById('catcount-'+cat.id);
  if (el) el.textContent = cat.items.length+'개';
}

// Helpers
function findItem(companyId, catId, itemId) {
  const company = state.companies.find(c=>c.id===companyId);
  const cat = company?.categories.find(c=>c.id===catId);
  const item = cat?.items.find(i=>i.id===itemId);
  return (company&&cat&&item) ? {company,cat,item} : null;
}
function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Reset / Save / Load / Share
function resetAll() {
  if (!confirm('모든 체크를 초기화할까요?')) return;
  state.companies.forEach(c=>c.categories.forEach(cat=>cat.items.forEach(i=>i.checked=false)));
  document.querySelectorAll('.item.checked').forEach(el=>el.classList.remove('checked'));
  updateGlobalProgress();
  state.companies.forEach(c=>updateCompanyProgress(c));
  save();
  showToast('초기화됐어요');
}
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
function load() {
  const params = new URLSearchParams(location.search);
  const s = params.get('s');
  if (s) { try { state = JSON.parse(decodeURIComponent(atob(s))); document.getElementById('shared-banner').classList.add('visible'); return; } catch(e) {} }
  try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) { state = JSON.parse(saved); return; } } catch(e) {}
  state = getDefaultData();
}
function shareURL() {
  const encoded = btoa(encodeURIComponent(JSON.stringify(state)));
  const url = location.origin + location.pathname + '?s=' + encoded;
  navigator.clipboard.writeText(url).then(()=>showToast('🔗 링크가 클립보드에 복사됐어요!')).catch(()=>prompt('링크를 복사하세요',url));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// Enter shortcuts
document.getElementById('company-name-input').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('company-role-input').focus(); });
document.getElementById('company-role-input').addEventListener('keydown', e=>{ if(e.key==='Enter') addCompany(); });

// Init
load();
render();
</script>
